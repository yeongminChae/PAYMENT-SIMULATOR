server:
  port: 8080

spring:
  application:
    name: payment-sim

  datasource:
    url: jdbc:sqlite:./data/payment-sim.db
    driver-class-name: org.sqlite.JDBC

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      # SQLite는 ALTER TABLE ADD COLUMN IF NOT EXISTS를 지원하지 않는다.
      # schema.sql을 기존 DB에도 재실행하므로, 이미 추가된 컬럼의 duplicate 오류는 통과시킨다.
      continue-on-error: true

  batch:
    job:
      # 서버가 시작될 때 Recovery Job이 자동 실행되지 않도록 한다.
      enabled: false

payment:
  recovery:
    discovery:
      # 각 상태가 이 시간보다 오래 유지된 거래만 복구 후보로 조회한다.
      unknown-timeout-age: ${PAYMENT_RECOVERY_DISCOVERY_UNKNOWN_TIMEOUT_AGE:30s}
      stale-processing-age: ${PAYMENT_RECOVERY_DISCOVERY_STALE_PROCESSING_AGE:1m}
      stale-pending-age: ${PAYMENT_RECOVERY_DISCOVERY_STALE_PENDING_AGE:1m}
    worker:
      lease-duration: ${PAYMENT_RECOVERY_WORKER_LEASE_DURATION:30s}
    schedule:
      # true일 때만 Recovery Job을 주기적으로 실행하는 Scheduler Bean을 만든다.
      enabled: ${PAYMENT_RECOVERY_SCHEDULE_ENABLED:false}
      # 이전 스케줄 호출이 끝난 뒤 다음 호출까지 기다릴 시간이다. 60000ms는 1분이다.
      fixed-delay-ms: ${PAYMENT_RECOVERY_SCHEDULE_FIXED_DELAY_MS:60000}
  card:
    # fingerprint 재현성을 위해 실행 환경마다 고정된 비밀키를 주입하며, 저장소에는 실제 키를 남기지 않는다.
    secret-key: ${CARD_SECRET_KEY}
  van:
    mode: ${PAYMENT_VAN_MODE:simulated}
    tcp:
      host: ${PAYMENT_VAN_TCP_HOST:localhost}
      port: ${PAYMENT_VAN_TCP_PORT:9090}
      connect-timeout-ms: ${PAYMENT_VAN_TCP_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${PAYMENT_VAN_TCP_READ_TIMEOUT_MS:5000}

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # MyBatis 로그를 SLF4J로 전달해 Logback 정책으로 기록한다.
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
