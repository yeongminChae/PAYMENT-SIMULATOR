spring:
  datasource:
    url: ${VAN_DB_URL:jdbc:postgresql://localhost:5433/van_sim}
    username: ${VAN_DB_USERNAME:postgres}
    password: ${VAN_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
