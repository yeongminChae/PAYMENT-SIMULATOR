spring:
  datasource:
    url: ${VAN_DB_URL:jdbc:postgresql://localhost:5433/van_sim}
    username: ${VAN_DB_USERNAME:postgres}
    password: ${VAN_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgres.sql
      continue-on-error: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

van:
  tcp:
    port: ${VAN_TCP_PORT:9090}
